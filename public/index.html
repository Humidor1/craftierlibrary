/* ===================== STORAGE SHIM (Netlify Function + Blobs instead of Claude artifact storage) ===================== */

window.storage = {
  async get(key) {
    try {
      const res = await fetch("/api/collection");
      if (!res.ok) return null;
      const data = await res.json();
      if (!data || Object.keys(data).length === 0) return null;
      return { key, value: JSON.stringify(data) };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      const res = await fetch("/api/collection", {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: value,
      });
      if (!res.ok) return null;
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

function familiesOf(name) {
  const words = name.toLowerCase().split(/\s+/);
  const tags = [];
  for (const w of words) {
    const clean = w.replace(/[^a-z]/g, "");
    const fam = KEYWORD_MAP[clean];
    if (fam && !tags.includes(fam)) tags.push(fam);
  }
  return tags.length ? tags : ["other"];
}

function slug(gender, name) {
  return gender + "-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

/* ===================== PAIRING ENGINE ===================== */

function scorePair(a, b, ratings) {
  const rA = ratings[a.id] || 0;
  const rB = ratings[b.id] || 0;
  const shared = a.tags.some((t) => b.tags.includes(t));
  const compatible = a.tags.some((t) => (COMPAT[t] || []).some((c) => b.tags.includes(c)));
  const familyScore = compatible ? 3 : shared ? 1 : 0.4;
  const effA = rA || 3, effB = rB || 3;
  const ratingScore = (effA + effB) / 2 - 3;
  const bothRated = rA > 0 && rB > 0;
  const total = familyScore * 2 + ratingScore * 3 + (bothRated ? 1 : 0);
  return { total, shared, compatible, rA, rB };
}

function weightClass(item) {
  return item.tags.some((t) => HEAVY.has(t)) ? "heavy" : "light";
}

function pairingAdvice(a, b, meta) {
  const wa = weightClass(a), wb = weightClass(b);
  let structure;
  if (wa !== wb) {
    const base = wa === "heavy" ? a : b;
    const top = wa === "heavy" ? b : a;
    structure = `Spray ${base.name} on chest and pulse points first as your base, then add ${top.name} on wrists or hair about a minute later so it sits on top as the brighter layer.`;
  } else if (wa === "heavy") {
    structure = `Both scents are rich and heavy. Apply ${a.name} on one pulse point (chest) and ${b.name} on another (wrist), rather than stacking them in the same spot, so neither one gets muddied.`;
  } else {
    structure = `Both scents are light. These can be sprayed together in the same area, or mixed on your palms, for a brighter blended accord.`;
  }
  let ratingNote = "";
  if (meta.rA > 0 && meta.rB > 0) {
    const avg = (meta.rA + meta.rB) / 2;
    if (avg >= 4.5) ratingNote = "Two of your top-rated scents — this is a strong candidate for a signature combo.";
    else if (avg <= 2.5) ratingNote = "Both of these are rated low for you. Worth trying once, but don't be surprised if it doesn't land.";
    else ratingNote = "A solid, middle-of-the-road pairing based on how you've rated these so far.";
  } else if (meta.rA > 0 || meta.rB > 0) {
    ratingNote = "One of these is still unrated — rate it after wearing this combo to sharpen future suggestions.";
  } else {
    ratingNote = "Neither scent is rated yet. Try this pairing and rate both afterward so advice can adapt.";
  }
  const famNote = meta.compatible
    ? `${FAMILY_LABEL[a.tags[0]]} and ${FAMILY_LABEL[b.tags[0]]} are a classic complementary pairing.`
    : meta.shared
    ? `These share a ${FAMILY_LABEL[a.tags.find((t) => b.tags.includes(t))]} note, so they'll blend safely rather than contrast.`
    : `These are an unconventional pairing across families — more experimental, less predictable.`;
  return { structure, ratingNote, famNote };
}

/* ===================== MAIN APP ===================== */

function App() {
  const [collection, setCollection] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const [tab, setTab] = useState("browse");
  const [search, setSearch] = useState("");
  const [genderFilter, setGenderFilter] = useState("All");
  const [familyFilter, setFamilyFilter] = useState("All");
  const [ownedOnlyAdvisor, setOwnedOnlyAdvisor] = useState(true);
  const [advisorResults, setAdvisorResults] = useState(null);

  useEffect(() => {
    (async () => {
      let existing = null;
      try {
        const res = await window.storage.get("perfume-collection", true);
        if (res && res.value) existing = JSON.parse(res.value);
      } catch (e) {}
      if (existing) {
        setCollection(existing);
      } else {
        setCollection(SEED_COLLECTION);
        try { await window.storage.set("perfume-collection", JSON.stringify(SEED_COLLECTION), true); } catch (e) {}
      }
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback(async (next) => {
    setCollection(next);
    try {
      const res = await window.storage.set("perfume-collection", JSON.stringify(next), true);
      setSaveError(!res);
    } catch (e) {
      setSaveError(true);
    }
  }, []);

  const toggleOwned = (id, kind) => {
    const cur = collection[id] || { full: false, tester: false, rating: 0 };
    const next = { ...cur, [kind]: !cur[kind] };
    const updated = { ...collection };
    if (!next.full && !next.tester) {
      delete updated[id];
    } else {
      updated[id] = next;
    }
    persist(updated);
  };

  const setRating = (id, rating) => {
    const cur = collection[id];
    if (!cur) return;
    persist({ ...collection, [id]: { ...cur, rating } });
  };

  const ratings = useMemo(() => {
    const r = {};
    Object.entries(collection).forEach(([id, v]) => { r[id] = v.rating || 0; });
    return r;
  }, [collection]);

  const ownedItems = useMemo(
    () => CATALOG.filter((c) => collection[c.id] && (collection[c.id].full || collection[c.id].tester)),
    [collection]
  );

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return CATALOG.filter((c) => {
      if (genderFilter !== "All" && c.gender !== genderFilter) return false;
      if (familyFilter !== "All" && !c.tags.includes(familyFilter)) return false;
      if (q && !c.name.toLowerCase().includes(q) && !c.inspiredBy.toLowerCase().includes(q)) return false;
      return true;
    });
  }, [search, genderFilter, familyFilter]);

  const generateAdvice = () => {
    const pool = ownedOnlyAdvisor ? ownedItems : CATALOG;
    if (pool.length < 2) { setAdvisorResults([]); return; }
    const pairs = [];
    for (let i = 0; i < pool.length; i++) {
      for (let j = i + 1; j < pool.length; j++) {
        const meta = scorePair(pool[i], pool[j], ratings);
        pairs.push({ a: pool[i], b: pool[j], meta });
      }
    }
    const wellRated = pairs.filter((p) => (p.meta.rA === 0 || p.meta.rA >= 3) && (p.meta.rB === 0 || p.meta.rB >= 3));
    const usable = wellRated.length >= 5 ? wellRated : pairs;
    usable.sort((x, y) => y.meta.total - x.meta.total);
    setAdvisorResults(usable.slice(0, 6));
  };

  const lowRated = useMemo(
    () => ownedItems.filter((i) => (collection[i.id] && collection[i.id].rating || 0) > 0 && collection[i.id].rating <= 2),
    [ownedItems, collection]
  );

  const tabs = [
    { id: "browse", label: "Browse Catalog" },
    { id: "collection", label: `My Collection (${ownedItems.length})` },
    { id: "advisor", label: "Layering Advisor" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: "system-ui, -apple-system, sans-serif" }}>
      <style>{`
        ${FONT_IMPORT}
        * { box-sizing: border-box; }
        ::selection { background: ${C.gold}55; }
        button { font-family: inherit; }
        input:focus, button:focus-visible, select:focus-visible { outline: 2px solid ${C.gold}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
      `}</style>

      <header style={{ padding: "36px 20px 22px", borderBottom: `1px solid ${C.borderSoft}`, background: `linear-gradient(180deg, ${C.bgAlt}, ${C.bg})` }}>
        <div style={{ maxWidth: 980, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: "0.14em", color: C.gold, textTransform: "uppercase" }}>
            <FlaskConical size={14} /> Personal Fragrance Ledger
          </div>
          <h1 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: "clamp(28px, 4vw, 40px)", margin: "8px 0 6px", letterSpacing: "-0.01em" }}>
            The Cabinet
          </h1>
          <p style={{ color: C.textMuted, fontSize: 14.5, maxWidth: 560, lineHeight: 1.5, margin: 0 }}>
            Track every bottle and tester from the Craftier catalog, rate what you wear, and get layering pairings
            that shift as your ratings do.
          </p>
        </div>
      </header>

      <nav style={{ maxWidth: 980, margin: "0 auto", padding: "18px 20px 0", display: "flex", gap: 6, flexWrap: "wrap" }}>
        {tabs.map((t) => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            style={{
              padding: "9px 16px", borderRadius: 999, border: `1px solid ${tab === t.id ? C.gold : C.border}`,
              background: tab === t.id ? C.gold : "transparent", color: tab === t.id ? C.bgAlt : C.textMuted,
              fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 600, cursor: "pointer",
              letterSpacing: "0.02em",
            }}
          >
            {t.label}
          </button>
        ))}
      </nav>

      <main style={{ maxWidth: 980, margin: "0 auto", padding: "20px 20px 60px" }}>
        {!loaded && <div style={{ color: C.textFaint, padding: 40, textAlign: "center" }}>Opening the cabinet…</div>}

        {loaded && tab === "browse" && (
          <BrowseTab
            filtered={filtered} search={search} setSearch={setSearch}
            genderFilter={genderFilter} setGenderFilter={setGenderFilter}
            familyFilter={familyFilter} setFamilyFilter={setFamilyFilter}
            collection={collection} toggleOwned={toggleOwned} setRating={setRating}
          />
        )}

        {loaded && tab === "collection" && (
          <CollectionTab ownedItems={ownedItems} collection={collection} toggleOwned={toggleOwned} setRating={setRating} />
        )}

        {loaded && tab === "advisor" && (
          <AdvisorTab
            ownedItems={ownedItems} ownedOnlyAdvisor={ownedOnlyAdvisor} setOwnedOnlyAdvisor={setOwnedOnlyAdvisor}
            generateAdvice={generateAdvice} advisorResults={advisorResults} lowRated={lowRated}
          />
        )}

        {saveError && (
          <div style={{ marginTop: 16, fontSize: 12.5, color: C.rose, fontFamily: "'IBM Plex Mono', monospace" }}>
            Couldn't save that change — check your connection and try again.
          </div>
        )}
      </main>

      <footer style={{ borderTop: `1px solid ${C.borderSoft}`, padding: "16px 20px", textAlign: "center", color: C.textFaint, fontSize: 11.5, fontFamily: "'IBM Plex Mono', monospace" }}>
        Collection data syncs across every device that opens this site.
      </footer>
    </div>
  );
}

/* ===================== BROWSE TAB ===================== */

function BrowseTab({ filtered, search, setSearch, genderFilter, setGenderFilter, familyFilter, setFamilyFilter, collection, toggleOwned, setRating }) {

          return (

/* ===================== COLLECTION TAB ===================== */

function CollectionTab({ ownedItems, collection, toggleOwned, setRating }) {

      <EmptyState

    );
  }

  const grouped = {};
  ownedItems.forEach((item) => {
    const fam = item.tags[0];
    grouped[fam] = grouped[fam] || [];
    grouped[fam].push(item);
  });

  return (
    <div>
      {Object.entries(grouped).map(([fam, items]) => (

            <span style={{ width: 8, height: 8, borderRadius: "50%", background: FAMILY_COLOR[fam] }} />

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 12 }}>
            {items.map((item) => {

                      <DropletRating value={owned.rating || 0} onChange={(v) => setRating(item.id, v)} />

                    <button
                      onClick={() => { toggleOwned(item.id, "full"); if (owned.full) toggleOwned(item.id, "tester"); }}
                      style={{ background: "none", border: "none", color: C.textFaint, cursor: "pointer", padding: 4 }}

      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {advisorResults && advisorResults.map((p, idx) => {
          const advice = pairingAdvice(p.a, p.b, p.meta);
          return (
            <div key={idx} style={{ background: C.cardAlt, border: `1px solid ${C.border}`, borderRadius: 12, padding: 18 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
                <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: 17 }}>{p.a.name}</span>
                <span style={{ color: C.gold, fontFamily: "'IBM Plex Mono', monospace" }}>+</span>
                <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: 17 }}>{p.b.name}</span>
              </div>
              <p style={{ margin: "0 0 8px", color: C.text, fontSize: 13.5, lineHeight: 1.55 }}>{advice.structure}</p>
              <p style={{ margin: "0 0 8px", color: C.textMuted, fontSize: 12.5, lineHeight: 1.5 }}>{advice.famNote}</p>
              <p style={{ margin: 0, color: C.gold, fontSize: 12.5, lineHeight: 1.5, fontStyle: "italic" }}>{advice.ratingNote}</p>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function EmptyState({ title, body }) {
  return (
    <div style={{ textAlign: "center", padding: "50px 20px", border: `1px dashed ${C.border}`, borderRadius: 12, color: C.textMuted }}>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, color: C.text, marginBottom: 6 }}>{title}</div>
      <div style={{ fontSize: 13.5, maxWidth: 380, margin: "0 auto", lineHeight: 1.5 }}>{body}</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
